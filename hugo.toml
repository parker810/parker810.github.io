    identifier = "github"
    pre = "<i class='fab fa-github' aria-hidden='true'></i>"
    name = ""
    url = "https://github.com/parker810"
    title = "GitHub"

[pagination]

[markup]
  [markup.highlight]
    noClasses = false

[params]
  defaultTheme = "dark"
  dateFormat = "2006-01-02"
  title = "Peter's blog"
  description = "Security • Web3 • AI • Red Team"

  [params.author]
    name = "Peter"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "Peter's blog"
      typeit = false

  [params.footer]
    enable = false

  [params.search]
    enable = true
    type = "fuse"

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.jpg"
      title = "Peter's blog"
      subtitle = "Security • Web3 • AI • Red Team"
      typeit = true
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "parker810"
    Email = "saul.parker810@gmail.com"
    RSS = true

  [params.page.comment]
    enable = true
    [params.page.comment.giscus]
      enable = true
      repo = "parker810/parker810.github.io"
      repoId = "R_kgDOU00qeA"
      category = "General"
      categoryId = "DIC_kwDOU00qeM4DGvEK"
      mapping = "pathname"
      lang = "zh-CN"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lightTheme = "light"
      darkTheme = "dark"
