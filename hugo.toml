languageName = "简体中文"
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

[menu]
  [[menu.main]]
    weight = 1
    identifier = "home"
    name = "首页"
    url = "/"
  [[menu.main]]
    weight = 2
    identifier = "posts"
    name = "文章"
    url = "/posts/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "tags"
    name = "标签"
    url = "/tags/"
  [[menu.main]]
